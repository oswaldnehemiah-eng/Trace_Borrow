{% extends "base.html" %}
{% block title %}Login - TraceBorrow{% endblock %}
{% block content %}
<div class="card form-card">
    <h1 class="page-title">Login</h1>
    <p class="subtitle">Log in with your TraceBorrow username.</p>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="subtitle footer-link">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
